name: KGP practical information
on:
  pull_request:
    paths:
      - 'docs/catalogue/kgp-practical-01/**'
      - 'scripts/build_kgp_practical_01.py'
      - 'supabase/tests/kgp_practical*'
      - '.github/workflows/kgp-practical-review.yml'
  push:
    branches: [main]
    paths:
      - 'docs/catalogue/kgp-practical-01/**'
      - 'scripts/build_kgp_practical_01.py'
      - 'supabase/tests/kgp_practical*'
      - '.github/workflows/kgp-practical-review.yml'
permissions:
  contents: read
jobs:
  practical-package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-test-only
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_kgp_practical_01.py --check
      - run: createdb -U postgres kgp_practical_01_test
      - run: python supabase/tests/kgp_practical_01_test.py
